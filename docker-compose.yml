services:
    backend:
        container_name: NAME_BACKEND
        build:
            context: .
            dockerfile: .conf/development/backend/Dockerfile
        env_file: .env
        environment:
            DATABASE_CLIENT: ${DATABASE_CLIENT}
            DATABASE_HOST: NAME_DB
            DATABASE_PORT: ${DATABASE_PORT}
            DATABASE_NAME: ${DATABASE_NAME}
            DATABASE_USERNAME: ${DATABASE_USERNAME}
            DATABASE_PASSWORD: ${DATABASE_PASSWORD}
            JWT_SECRET: ${JWT_SECRET}
            ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET}
            APP_KEYS: ${APP_KEYS}
            NODE_ENV: ${NODE_ENV}
        volumes:
            - ./backend/config:/opt/app/config
            - ./backend/src:/opt/app/src
            - ./backend/package.json:/opt/package.json
            - ./backend/package-lock.json:/opt/package-lock.json
            - ./backend/public/uploads:/opt/app/public/uploads
            - .env:/opt/app/.env
        ports:
            - ${BACKEND_PORT}:${BACKEND_PORT}
        depends_on:
            - db
    db:
        container_name: NAME_DB
        platform: linux/amd64 #for platform error on Apple M1 chips
        env_file: .env
        image: postgres:19-alpine
        environment:
            POSTGRES_USER: ${DATABASE_USERNAME}
            POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
            POSTGRES_DB: ${DATABASE_NAME}
            PGPORT: ${DATABASE_PORT}
        volumes:
            - data:/var/lib/postgresql/data/ #using a volume
        ports:
            - ${DATABASE_PORT}:${DATABASE_PORT}
volumes:
    data:
